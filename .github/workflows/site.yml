name: Portal público — build e GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build e verificações estáticas
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar arquivos do projeto
        run: npm run check:source

      - name: Testar integridade editorial e referências
        run: npm run test:content

      - name: Compilar site estático
        run: npm run build

      - name: Verificar resultado e caminhos do Pages
        run: npm run check:dist

      - name: Auditar páginas, links e estados editoriais
        run: npm run audit:dist

      - name: Preparar artefato de publicação
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  preview-editorial:
    name: Simular publicação didática sem publicar
    # Isolado: NÃO usa o artefato do job build nem faz upload ao Pages.
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter cópia descartável
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Simular aprovação APENAS no runner
        run: node scripts/simulate-publication.mjs prepare

      - name: Gerar páginas e exercícios simulados
        run: npm run build

      - name: Conferir rotas, oficina e fontes
        run: node scripts/simulate-publication.mjs verify

      - name: Auditar HTML da simulação
        run: npm run audit:dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v4
